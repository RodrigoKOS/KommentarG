<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KommentarG - Teste</title>
  <style>
    body { font-family: Arial, Helvetica, sans-serif; max-width: 760px; margin: 32px auto; padding: 0 20px; background: #fff; color: #202124; }
    .kg-grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
    .kg-card { background: #f1f3f4; border-radius: 12px; padding: 16px 18px; }
    .kg-head { display: flex; gap: 10px; align-items: center; }
    .kg-avatar { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; background: #dadce0; display: flex; align-items: center; justify-content: center; font-weight: bold; color: #5f6368; flex-shrink: 0; }
    .kg-name { font-weight: bold; font-size: 15px; display: flex; align-items: center; gap: 5px; }
    .kg-check { width: 16px; height: 16px; }
    .kg-sub { display: flex; align-items: center; gap: 5px; color: #5f6368; font-size: 13px; margin-top: 2px; }
    .kg-g { width: 18px; height: 18px; }
    .kg-stars { color: #FBBC04; font-size: 20px; letter-spacing: 2px; margin: 8px 0 6px; }
    .kg-text { font-size: 15px; line-height: 1.45; margin: 0; }
    .kg-more { color: #1a73e8; cursor: pointer; font-size: 15px; text-decoration: none; background: none; border: none; padding: 0; }
  </style>
</head>
<body>
  <h1>KommentarG - Teste visual</h1>
  <p id="info">Carregando...</p>
  <div id="lista" class="kg-grid">Carregando...</div>

  <script>
    function esc(s) { return String(s||'').replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
    function avatar(r) {
      if (r.authorPhoto) return '<img class="kg-avatar" src="' + esc(r.authorPhoto) + '" alt="" />';
      var initial = esc((r.author||'A').trim().charAt(0).toUpperCase());
      return '<div class="kg-avatar">' + initial + '</div>';
    }
    function card(r) {
      var full = esc(r.text||'');
      var short = full.length > 140 ? full.slice(0, 140) + '...' : full;
      var needMore = full.length > 140;
      var stars = '★'.repeat(r.stars||0) + '☆'.repeat(5-(r.stars||0));
      return '<div class="kg-card">' +
        '<div class="kg-head">' + avatar(r) +
          '<div><div class="kg-name">' + esc(r.author||'Anônimo') +
            '<svg class="kg-check" viewBox="0 0 24 24" fill="#1a73e8"><path d="M12 2l2.4 2.4 3.4-.5.9 3.3 3 1.7-1.4 3.1 1.4 3.1-3 1.7-.9 3.3-3.4-.5L12 22l-2.4-2.4-3.4.5-.9-3.3-3-1.7L3.7 12 2.3 8.9l3-1.7.9-3.3 3.4.5z"/><path d="M10.6 14.6l-2.1-2.1-1.4 1.4 3.5 3.5 7-7-1.4-1.4z" fill="#fff"/></svg>' +
          '</div>' +
          '<div class="kg-sub">' +
            '<svg class="kg-g" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.5 12.3c0-.9-.1-1.5-.3-2.3H12v4.3h6.5c-.1 1.1-.8 2.7-2.4 3.8l-.1.1 3.5 2.7.2.1c2.2-2 3.8-5 3.8-8.7z"/><path fill="#34A853" d="M12 24c3.2 0 5.9-1.1 7.9-2.9l-3.8-2.9c-1 .7-2.4 1.2-4.1 1.2-3.1 0-5.8-2.1-6.8-5l-.1.1-3.6 2.8v.1C3.5 21.3 7.5 24 12 24z"/><path fill="#FBBC05" d="M5.2 14.4c-.2-.7-.4-1.5-.4-2.4s.1-1.7.4-2.4l-.1-.1-3.5-2.7-.1.1C.5 8.9 0 10.4 0 12s.5 3.1 1.5 4.5l3.7-2.1z"/><path fill="#EA4335" d="M12 4.7c1.8 0 3 .8 3.7 1.4l3.3-3.2C17.9 1.1 15.2 0 12 0 7.5 0 3.5 2.7 1.5 6.9l3.7 2.8c1-2.9 3.7-5 6.8-5z"/></svg>' +
            '<span>' + esc(r.relativeTime||r.date||'') + '</span>' +
          '</div></div>' +
        '</div>' +
        '<div class="kg-stars">' + stars + '</div>' +
        '<p class="kg-text"><span class="short">' + short + '</span><span class="full" style="display:none">' + full + '</span>' +
        (needMore ? ' <button class="kg-more">Read more</button>' : '') + '</p>' +
      '</div>';
    }
    fetch('/api/reviews')
      .then(function(r){ return r.json(); })
      .then(function(d){
        document.getElementById('info').innerHTML = '<b>' + esc(d.business) + ' - ' + d.rating + ' estrelas (' + d.total + ')</b> - ' + esc(d.mode);
        var box = document.getElementById('lista');
        box.innerHTML = d.reviews.map(card).join('');
        box.querySelectorAll('.kg-card').forEach(function(c){
          var btn = c.querySelector('.kg-more');
          if (!btn) return;
          btn.addEventListener('click', function(){
            var short = c.querySelector('.short');
            var full = c.querySelector('.full');
            var open = full.style.display !== 'none';
            full.style.display = open ? 'none' : 'inline';
            short.style.display = open ? 'inline' : 'none';
            btn.textContent = open ? 'Read more' : 'Show less';
          });
        });
      })
      .catch(function(){ document.getElementById('lista').innerText = 'Erro ao carregar API'; });
  </script>
</body>
</html>
